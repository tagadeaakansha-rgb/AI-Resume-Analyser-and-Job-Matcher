server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-resume-analyser
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # Primary database configuration with environment variable overrides
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/resume_analyser_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Anthropic Claude API Configuration
claude:
  api-key: ${CLAUDE_API_KEY:}
  model: ${CLAUDE_MODEL:claude-3-5-sonnet-20241022}
  api-url: https://api.anthropic.com/v1/messages
  anthropic-version: "2023-06-01"

# CORS configuration
app:
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
